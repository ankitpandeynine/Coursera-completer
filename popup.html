<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; width: 260px; padding: 15px; background: #f9f9f9; margin: 0; }
    h3 { margin-top: 0; color: #0056D2; font-size: 15px; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
    .control-group { margin-bottom: 12px; }
    label { font-size: 13px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    input[type="number"] { width: 60px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }
    .checkbox-label { justify-content: flex-start; gap: 8px; }
    
    /* New GitHub Footer Styles */
    .footer { margin-top: 15px; text-align: center; font-size: 12px; border-top: 1px solid #ddd; padding-top: 12px; }
    .footer a { color: #24292e; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: bold; transition: color 0.2s;}
    .footer a:hover { color: #0056D2; }
  </style>
</head>
<body>
  <h3>Coursera Auto-Pilot</h3>
  
  <div class="control-group">
    <label>
      <strong>Force Speed (x):</strong>
      <input type="number" id="speedInput" step="0.5" min="1" max="16" value="3">
    </label>
  </div>

  <div class="control-group">
    <label class="checkbox-label">
      <input type="checkbox" id="bgPlayCB" checked> 
      <span>Enable Background Play</span>
    </label>
  </div>

  <div class="control-group">
    <label class="checkbox-label">
      <input type="checkbox" id="autoNavigateCB" checked> 
      <span>Auto-Navigate & Complete</span>
    </label>
  </div>

  <!-- GitHub Link Footer -->
  <div class="footer">
    <a href="https://github.com/ankitpandeynine/Coursera-completer" target="_blank" rel="noopener noreferrer" title="View source code on GitHub">
      <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
      </svg>
      Star on GitHub
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
